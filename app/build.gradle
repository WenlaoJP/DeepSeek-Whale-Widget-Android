plugins {
    id 'com.android.application'
}

android {
    namespace 'com.deepseek.whalepet'   // AGP8 用 namespace，请同时删掉 manifest 里的 package 属性
    compileSdk 34

    defaultConfig {
        applicationId "com.deepseek.whalepet"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
